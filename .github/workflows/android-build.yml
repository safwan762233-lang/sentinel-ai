name: Android debug build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools ndk;27.2.12479018'
          accept-android-sdk-licenses: true
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Rust Android toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Build YARA-X native engine
        working-directory: app/src/main/rust
        run: |
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -t x86_64 -o ../../jniLibs build --release
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
